<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ludomatics Ansheet</title>
    <link rel="stylesheet" href="../exam.css">
</head>
<body>
    <!-- One page for every answer sheet: examen.html?id=<exam-id> loads exams/<exam-id>.json. -->
    <div id="loading">Cargando examen...</div>
    <div id="questionsContainer" style="display:none;"></div>
    <script type="module">
        import { generateExamSheet } from '../src/questionGenerator.js';
        import { inputListeners } from '../src/inputListeners.js';
        import { examService } from '../src/examService.js';

        (async function() {
            try {
                const id = new URLSearchParams(location.search).get('id');
                if (!id || !/^[a-z0-9-]+$/.test(id)) {
                    throw new Error('Missing or invalid exam id');
                }
                const examData = await examService.loadExamData(`${id}.json`);

                if (!examService.validateExamData(examData)) {
                    throw new Error('Invalid exam data structure');
                }

                await generateExamSheet(examData);
                inputListeners();
            } catch (error) {
                console.error('Error loading exam:', error);
                document.getElementById('loading').innerHTML = 'Error cargando el examen. Por favor, recarga la página.';
            }
        })();
    </script>
</body>
</html>
