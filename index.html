<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ludomatics - Exámenes</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <div class="header">
        <h1>📚 Ludomatics - Exámenes</h1>
        <p>Selecciona el examen que deseas realizar</p>
    </div>

    <div id="categories"></div>

    <script type="module">
        // The exam list lives in exams/index.json: one card per exam, grouped by category, in that order.
        const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        const container = document.getElementById('categories');
        try {
            const response = await fetch('exams/index.json', { cache: 'no-cache' });
            if (!response.ok) throw new Error(response.statusText);
            const { categories } = await response.json();
            container.innerHTML = categories.map(category => `
        <div class='category'>
            <h2>${esc(category.title)}</h2>
            <div class='exam-grid'>${category.exams.map(exam => `
                <div class='exam-card'>
                    <h3>${esc(exam.title)}</h3>
                    <a href='exams/examen.html?id=${encodeURIComponent(exam.id)}' class='btn'>Comenzar Examen</a>
                </div>`).join('')}
            </div>
        </div>`).join('');
        } catch (error) {
            console.error('Error loading exam list:', error);
            container.innerHTML = '<p>Error cargando los exámenes. Por favor, recarga la página.</p>';
        }
    </script>
</body>
</html>
